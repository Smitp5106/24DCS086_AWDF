name: Task Management CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Automated Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      # Step 3: Install dependencies for Backend (Explicit required step)
      - name: Install dependencies (npm install)
        run: npm install
        working-directory: ./backend

      # Step 4: Run automated tests and report pass/fail
      - name: Run automated tests
        run: npm test
        working-directory: ./backend

      # Step 5: Install dependencies for Frontend
      - name: Install Frontend dependencies
        run: npm install
        working-directory: ./frontend

      # Step 6: Build Frontend application
      - name: Build Frontend (React + Vite)
        run: npm run build
        working-directory: ./frontend
