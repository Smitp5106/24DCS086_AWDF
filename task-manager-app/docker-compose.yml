services:
  # ==========================================
  # Service 1: MongoDB Database
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: task-manager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=task-manager
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Service 2: Node/Express Backend API
  # ==========================================
  backend:
    build:
      context: ./task-manager-app/backend
      dockerfile: Dockerfile
    container_name: task-manager-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/task-manager
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  # ==========================================
  # Service 3: React Frontend (Vite + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./task-manager-app/frontend
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

# ==========================================
# Named Volumes (Data Persistence)
# ==========================================
volumes:
  mongo-data:
    driver: local

# ==========================================
# Internal Docker Network (Service Discovery)
# ==========================================
networks:
  app-network:
    driver: bridge
